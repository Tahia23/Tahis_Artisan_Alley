<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tahi's Artisan Alley</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .admin-container { margin: 20px; }
        .product-list-box { margin-top: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        
        /* এডিট, অ্যাকসেপ্ট ও রিজেক্ট বাটনের স্টাইল */
        .btn-edit {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            margin-right: 5px;
            border-radius: 4px;
        }
        .btn-delete {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-cancel {
            background-color: #777;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            margin-left: 10px;
        }
        .btn-accept {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 5px;
        }
        .btn-reject {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo-area">
                <h1>Admin Dashboard</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="../index.html">View Site</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="admin-container">
        <!-- প্রোডাক্ট আপলোড ও এডিট ফর্ম -->
        <div class="form-box">
            <h2 id="form-heading">Add New Product</h2>
            <form id="productForm">
                <!-- এডিট করার সময় আইডি জমা রাখার হিডেন ইনপুট -->
                <input type="hidden" id="editProductId" name="editProductId">

                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" name="name" id="prodName" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select name="category" id="prodCategory" required>
                        <option value="cotton">Cotton Ready Dress</option>
                        <option value="skincare">Skin Care</option>
                        <option value="bags">Bags</option>
                        <option value="accessories">Accessories</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (BDT)</label>
                    <input type="number" name="price" id="prodPrice" required>
                </div>
                <div class="form-group">
                    <label>Image URL or Name (e.g., https://... or s5.jpg)</label>
                    <input type="text" name="image" id="prodImage" placeholder="Paste direct image link here" required>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">Upload Product</button>
                <button type="button" class="btn-cancel" id="cancelBtn" style="display: none;" onclick="resetForm()">Cancel Edit</button>
            </form>
        </div>

        <!-- কাস্টমার অর্ডার টেবিল সেকশন (নতুন যোগ করা হয়েছে) -->
        <div class="product-list-box">
            <h2>Customer Orders</h2>
            <table>
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Phone & Address</th>
                        <th>Items & Total</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="order-body">
                    <!-- ডাইনামিক অর্ডার ডাটা এখানে আসবে -->
                </tbody>
            </table>
        </div>

        <!-- বর্তমান প্রোডাক্টস টেবিল -->
        <div class="product-list-box">
            <h2>Current Products</h2>
            <table id="product-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="product-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
    // প্রোটেকশন চেক (অ্যাডমিন ছাড়া কেউ ঢুকতে পারবে না)
    if (localStorage.getItem('userEmail') !== 'tahiasima023@gmail.com') {
        alert("Access Denied! Only for Admin.");
        window.location.href = '/'; 
    }

    let globalProducts = [];

    // ১. প্রোডাক্ট লোড করা
    async function loadProducts() {
        try {
            const response = await fetch('https://tahis-artisan-alley.onrender.com/get-products');
            globalProducts = await response.json();
            const body = document.getElementById('product-body');
            body.innerHTML = ''; 
            
            globalProducts.forEach(product => {
                body.innerHTML += `
                    <tr>
                        <td>${product.name}</td>
                        <td>${product.category}</td>
                        <td>
                            <button class="btn-edit" onclick="startEdit('${product._id}')">Edit</button>
                            <button class="btn-delete" onclick="deleteProduct('${product._id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("Error fetching products:", err);
        }
    }

    // ২. অর্ডার লোড করার ফাংশন (নতুন যোগ করা হয়েছে)
    async function loadOrders() {
        try {
            const response = await fetch('https://tahis-artisan-alley.onrender.com/get-orders');
            const orders = await response.json();
            const body = document.getElementById('order-body');
            body.innerHTML = '';

            orders.forEach(order => {
                // অর্ডার আইটেম তালিকা রূপান্তর
                let itemsList = '';
                if (Array.isArray(order.items)) {
                    itemsList = order.items.map(item => typeof item === 'object' ? `${item.name || 'Product'} (x${item.quantity || 1})` : item).join(', ');
                } else {
                    itemsList = order.items || 'N/A';
                }

                body.innerHTML += `
                    <tr>
                        <td>
                            <b>${order.name}</b><br>
                            <small>${order.email || 'No email'}</small>
                        </td>
                        <td>${order.phone}<br><small>${order.address}</small></td>
                        <td>${itemsList}<br><b>Total: ৳${order.total}</b></td>
                        <td><b style="color: ${getStatusColor(order.status)}">${order.status || 'Pending'}</b></td>
                        <td>
                            <button class="btn-accept" onclick="updateOrderStatus('${order._id}', 'Accepted')">Accept</button>
                            <button class="btn-reject" onclick="updateOrderStatus('${order._id}', 'Rejected')">Reject</button>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("Error loading orders:", err);
        }
    }

    // স্ট্যাটাস অনুসারে টেক্সটের কালার নির্ধারণ
    function getStatusColor(status) {
        if (status === 'Accepted') return '#28a745';
        if (status === 'Rejected') return '#dc3545';
        return '#ff9800'; // Pending
    }

    // ৩. অর্ডার Accept / Reject স্ট্যাটাস আপডেট করা (নতুন যোগ করা হয়েছে)
    async function updateOrderStatus(id, status) {
        if(confirm(`আপনি কি এই অর্ডারটি ${status} করতে চান?`)) {
            try {
                await fetch(`https://tahis-artisan-alley.onrender.com/update-order-status/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                loadOrders(); 
            } catch (err) {
                console.error("Error updating order status:", err);
            }
        }
    }

    // ৪. এডিট বাটনে ক্লিক করলে ফর্মে ডেটা সেট করা
    function startEdit(id) {
        const product = globalProducts.find(p => p._id === id);
        if (!product) return;

        document.getElementById('editProductId').value = product._id;
        document.getElementById('prodName').value = product.name;
        document.getElementById('prodCategory').value = product.category;
        document.getElementById('prodPrice').value = product.price;
        document.getElementById('prodImage').value = product.image;

        // UI চেঞ্জ (এডিট মোড)
        document.getElementById('form-heading').innerText = 'Edit Product';
        document.getElementById('submitBtn').innerText = 'Update Product';
        document.getElementById('cancelBtn').style.display = 'inline-block';
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ৫. ফর্ম রিসেট করা
    function resetForm() {
        document.getElementById('editProductId').value = '';
        document.getElementById('productForm').reset();
        document.getElementById('form-heading').innerText = 'Add New Product';
        document.getElementById('submitBtn').innerText = 'Upload Product';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    // ৬. ডিলিট ফাংশন
    async function deleteProduct(id) {
        if(confirm("প্রোডাক্টটি ডিলিট করতে চান?")) {
            await fetch(`https://tahis-artisan-alley.onrender.com/delete-product/${id}`, { method: 'DELETE' });
            loadProducts(); 
        }
    }

    // ৭. প্রোডাক্ট অ্যাড বা আপডেট সামলানো
    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const editId = document.getElementById('editProductId').value;
        const formData = new FormData(e.target);
        const productData = Object.fromEntries(formData.entries());

        // স্পেস রিমুভ করা
        productData.image = productData.image.trim();
        delete productData.editProductId;

        const isEdit = Boolean(editId);
        const url = isEdit 
            ? `https://tahis-artisan-alley.onrender.com/edit-product/${editId}` 
            : 'https://tahis-artisan-alley.onrender.com/add-product';
        const method = isEdit ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(productData)
            });

            if (res.ok) {
                alert(isEdit ? 'Product Updated Successfully!' : 'Product Added Successfully!');
                resetForm();
                loadProducts(); 
            } else {
                alert('Operation failed!');
            }
        } catch (err) {
            console.error("Error submitting form:", err);
        }
    });

    // পেজ লোড হবার সময় কল করা
    loadProducts(); 
    loadOrders();
    </script>
</body>
</html>
